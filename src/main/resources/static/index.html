<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FeedbackFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
    <h1>FeedbackFlow</h1>
    <p>Course Feedback Collection System</p>
</div>

<div class="container">

    <!-- ADD COURSE -->

    <div class="box">

        <h2>Add Course</h2>

        <form id="courseForm">

            <label>Course Code</label>
            <input
                    type="text"
                    id="courseCode"
                    placeholder="CS101"
                    required
            >

            <label>Course Name</label>
            <input
                    type="text"
                    id="courseName"
                    placeholder="Java Programming"
                    required
            >

            <label>Faculty Name</label>
            <input
                    type="text"
                    id="facultyName"
                    placeholder="Dr. Kumar"
                    required
            >

            <button type="submit">
                Add Course
            </button>

        </form>

        <p id="message"></p>

    </div>


    <!-- COURSE LIST -->

    <div class="box">

        <h2>Available Courses</h2>

        <button onclick="getCourses()">
            Load Courses
        </button>

        <div id="courses">
            <p>Click "Load Courses" to see courses.</p>
        </div>

    </div>


    <!-- SUBMIT FEEDBACK -->

    <div class="box">

        <h2>Submit Feedback</h2>

        <form id="feedbackForm">

            <label>Feedback Form ID</label>
            <input
                    type="number"
                    id="feedbackFormId"
                    placeholder="1"
                    required
            >

            <label>Question ID</label>
            <input
                    type="number"
                    id="questionId"
                    placeholder="1"
                    required
            >

            <label>Student ID</label>
            <input
                    type="text"
                    id="studentId"
                    placeholder="25AD038"
                    required
            >

            <label>Rating</label>

            <select id="rating" required>

                <option value="">
                    Select Rating
                </option>

                <option value="1">1 - Poor</option>
                <option value="2">2 - Fair</option>
                <option value="3">3 - Good</option>
                <option value="4">4 - Very Good</option>
                <option value="5">5 - Excellent</option>

            </select>

            <button type="submit">
                Submit Feedback
            </button>

        </form>

        <p id="feedbackMessage"></p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
