<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FeedbackFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>FeedbackFlow</h1>
    <p>Course Feedback Collection System</p>
</header>

<div class="container">

    <!-- Course Section -->
    <section class="card">

        <h2>Add Course</h2>

        <form id="courseForm">

            <label>Course Code</label>
            <input type="text" id="courseCode" placeholder="Example: CS101" required>

            <label>Course Name</label>
            <input type="text" id="courseName" placeholder="Example: Java Programming" required>

            <label>Faculty Name</label>
            <input type="text" id="facultyName" placeholder="Example: Dr. Kumar" required>

            <button type="submit">Add Course</button>

        </form>

        <p id="courseMessage"></p>

    </section>


    <!-- Courses List -->
    <section class="card">

        <h2>Available Courses</h2>

        <button onclick="loadCourses()">Refresh Courses</button>

        <div id="courseList"></div>

    </section>


    <!-- Feedback Section -->
    <section class="card">

        <h2>Submit Feedback</h2>

        <form id="feedbackForm">

            <label>Feedback Form ID</label>
            <input type="number" id="feedbackFormId" required>

            <label>Question ID</label>
            <input type="number" id="questionId" required>

            <label>Student ID</label>
            <input type="text" id="studentId" placeholder="Example: 25AD038" required>

            <label>Rating</label>

            <select id="rating" required>
                <option value="">Select Rating</option>
                <option value="1">1 - Poor</option>
                <option value="2">2 - Fair</option>
                <option value="3">3 - Good</option>
                <option value="4">4 - Very Good</option>
                <option value="5">5 - Excellent</option>
            </select>

            <button type="submit">Submit Feedback</button>

        </form>

        <p id="feedbackMessage"></p>

    </section>

</div>

<script src="script.js"></script>

</body>

</html>
